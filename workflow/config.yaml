# Run configuration (PLAN.md §38). ONE file describes a run, and the runner reads all of
# it: `make ray-run` honours every lane switch and threshold below.
#
# It outlived Snakemake (§33) unchanged because it was always *run* config -- thresholds,
# lane switches, resource counts -- not workflow-engine config. The keys that WERE
# engine-specific (shortlist_path, docking_candidates_path, docking_shortlist_path,
# stage_marker_dir, validation_conda_prefix) were removed when the engine went; the store
# is the ledger now (§31a), so there are no marker paths to configure.
db_path: cache/protein_selector.db
candidate_ids_path: results/candidate_ids.txt  # frozen sample, PLAN.md §16c
report_csv_path: results/report.csv
max_candidates: 2000  # doubled 2026-07-19 to grow real MD+docking coverage beyond the
# first 1000-candidate sample (168 shortlist / 36 dockable) -- candidate_ids.txt deleted
# alongside this change to force a fresh, larger sample (PLAN.md §16c).
# CandidateFilterConfig overrides (2026-07-18, production run): a real
# 50-200 residue range (not CandidateFilterConfig's own exact-50 dataclass
# default) -- wide enough to get a real shortlist out of 1000 sampled
# candidates, still within PLAN.md §13's original 100-300 aa Colab-budget
# window's lower half.
min_residues: 50
max_residues: 200
max_resolution: 3.0

# Sequence relatives (PLAN.md §40) -- ON by default. A cheap-lane annotation, not a
# validator and never a filter: for each simulability survivor with a UniProt accession,
# its UniProt chain is searched with phmmer against Swiss-Prot on EBI's HMMER web API and
# the full-length hits are aligned locally with FAMSA. Four at a time
# (SequenceRelativesConfig.max_workers); a first backfill over a whole store is thousands
# of EBI jobs. A candidate is not searched again while its stored row was computed for its
# current first UniProt accession with the current database and relatives_max_identity.
# Needs network, no conda env. Set false to leave EBI alone for a run.
run_relatives: true
relatives_max_identity: 0.95  # hits this identical to a kept sequence count once; a new value re-searches
relatives_min_relatives: 10   # sets the recorded `passed` flag only; a new value re-flags, no search
relatives_max_workers: 4      # EBI jobs at once; keep it small, the server is shared
relatives_famsa_threads: 1    # threads per alignment; the lane uses max_workers x this many cores.
# On Ray it reserves at most that, and less on a small cluster: the three annotation lanes
# only get the CPUs left after the largest chemistry, MD or docking task (annotation_cpus).

# Residue numbering -- ON by default. A cheap-lane check, not a validator: for each
# simulability survivor with a UniProt accession, SIFTS' residue-level map (EBI) says
# whether every residue is numbered as UniProt numbers it, and the report records the
# verdict (uniprot_numbered) with its reasons. The pipeline filters nothing on it; a
# course list should. One SIFTS file and one UniProt entry per candidate, about 0.3 s;
# a stored verdict is not checked again, even after the rule changes, unless the run sets
# force_refresh (validate_one's --force-refresh; this file has no key for it). Needs
# network, no conda env.
run_numbering: true
numbering_max_workers: 4     # SIFTS + UniProt fetches at once; EBI's file server is shared

# Ligand context (PLAN.md §42) -- ON by default. A check after ligand chemistry, not a
# validator: for each simulability survivor with a dockable ligand, the entry's mmCIF file
# from RCSB says whether the ligand the docking step would pick is bonded to anything
# (_struct_conn) or within 4 A of a metal or a metal-containing group, which the MD and
# docking preparation strip. The report records the verdict (ligand_self_contained); the
# pipeline filters nothing on it. A stored row is reused while it judged today's pick.
# Picking needs rdkit (the validate extra). Set false to leave RCSB's file server alone.
run_ligand_context: true
ligand_context_max_workers: 4  # RCSB mmCIF downloads at once

# Slow lane (PLAN.md §16b) -- ON by default as of 2026-07-19: both the MD and docking
# validators are fully built, live-verified, and their conda env complete (PLAN.md
# §17e/§18/§19), so `make ray-run` exercises the WHOLE pipeline (cheap lane + MD +
# docking) with no extra flags. It must be DRIVEN from the validation conda env, whose
# `bin/` has to be on PATH and not merely its interpreter: openmm/vina/rdkit are imported
# as packages, but obabel and fpocket are called as binaries, and a missing binary is a
# per-candidate skip by design (§16b), not a crash, so the lane quietly does nothing
# instead of failing loudly. See `slurm/run_pipeline.sbatch` for the exact incantation.
# Set to `false` for a cheap-lane-only run, which needs no conda env at all.
run_md: true
restrict_md_to_dockable: true  # scripts/ligand_filter_fix_brief.md, Problem 3 -- turned
# on 2026-07-19 to cut real compute: of the 280-candidate sim shortlist, only ~52 ever
# reach the docking shortlist, so ~228 candidates' MD runs were pure waste in a
# docking-focused workflow (a candidate with no dockable ligand fails
# resolve_docking_target regardless of what MD says). MD is now only requested for
# candidates with a real, non-denylisted, Meeko-parameterizable ligand (the
# docking_candidates checkpoint, decided from already-cached cheap-lane data, no MD
# needed to compute it).
# **Real, stated tradeoff -- not free:** this also narrows `md_simulation` (ex03) report
# coverage down to the same dockable subset; a candidate outside it goes back to
# `not_run` for ex03 too, even though it was never actually MD-incompatible. If full ex03
# coverage is ever needed again independent of docking, set this back to `false` (or pass
# `--config restrict_md_to_dockable=false` for one run) -- nothing about the fix is
# destructive, already-persisted `validation` rows for previously-run candidates are
# untouched either way.
# NOTE: the `validation_conda_prefix` key this block used to document was removed with the
# Snakemake layer (§33). The validation env is now selected by the driver you launch the
# run with: `VALIDATION_ENV` in the Makefile, `PS_ENV` in `slurm/run_pipeline.sbatch`.
# The build advice below still applies to creating that env.
# Build it via `conda`, NOT via `environment-validation.yml`'s own
# "one shot, all ten packages" solve: that monolithic solve was tried twice
# on this machine and both times drove available RAM under 1GB before being
# killed (real, live-discovered, not a guess -- conda-forge's own solver
# combinatorics across openmm+openff-toolkit+openmmforcefields+pdbfixer+
# rdkit+vina+plip+openbabel+fpocket+meeko together are genuinely heavy).
# Fix: build incrementally (`conda create` with python, then one
# `conda install` per small package group -- see PLAN.md §15e for the exact
# sequence and which packages needed pip instead of conda-forge).
# **Docking-only packages (vina/plip/openbabel/fpocket/meeko/requests) must be added to
# this same prefix before `run_dock=true` will actually work (PLAN.md §17e)** -- not yet
# added as of 2026-07-18, this is the real, stated gap the docking rules above depend on.
# `requests` specifically: `resolve_docking_target` (used by `dock_validate`, which runs
# under this conda env) needs it directly for `docking.pdb_download.fetch_pdb_text` --
# unlike `md_validate` (PDBFixer fetches its own structure, no `requests` call), so
# `requests` was never in this env's original MD-only package list and must be added too.
md_threads: 2
md_n_steps: 50  # short smoke test (§15.0/PLAN.md §5b: setup/stability failure modes
# surface in minutes, not a converged trajectory -- see PLAN.md §15f for why cutting
# n_steps is correct scope, not a corner cut). 200 was already fast in practice
# (10-34s/candidate, live-verified, 4 real candidates, 99-164 residues).
# ⚠ Live-discovered tradeoff, not just a speed win: at 20/20 one real candidate
# (103L, 2687 atoms) minimized too little before its MD steps ran, and the
# system numerically blew up (final PE ~4e28 kJ/mol) -- but `run_test_md`'s
# stability check only catches NaN, not an absurd-but-finite energy, so this
# was recorded as `status=success`, a false positive. With the residue window
# now up to 200 (larger atom counts than the 20/20 test used), the same risk
# applies at 50/50 too -- watch `md_simulation_notes` for
# "may not have fully converged" and treat those rows' status with suspicion;
# use 200/200 (also fast, ~10-34s/candidate) if you need to fully trust the
# MD status for candidate selection.
# Separately, leaving this at 0 (unbounded, OpenMM's own default) let one real
# candidate's minimization run 13+ minutes before being killed -- exactly the
# risk md_validation.py's own docstring already named. Always set a real cap.
md_max_minimization_iterations: 50

# Docking slow lane (PLAN.md §17) -- ON by default as of 2026-07-19, see run_md above for
# why. Needs the same conda/mamba frontend as run_md plus the docking packages (all built
# into validation_conda_prefix as of PLAN.md §17e). Set false (or `--config
# run_dock=false`) to skip.
run_dock: true
dock_threads: 2
dock_exhaustiveness: 8  # Vina search effort -- do NOT lower for speed (PLAN.md §15h/§17h:
# low exhaustiveness produces FALSE self-dock failures and poisons the measured-difficulty
# gap this tool exists to compute). Parallelism + shortlist-only scoping is the speed
# answer, not degraded fidelity.
dock_box_padding: 6.0  # PLAN.md §17b/§18. Live-verified across dozens of real self-docks
# (2026-07-19, 2000-candidate run): produces real, sane docking boxes -- no evidence this
# default needs adjusting, but still a judgment call, not derived from any published
# source; revisit if a future candidate's box turns out too tight/loose. The margin added
# to a pocket's own maximum pairwise-vertex distance so a comparably sized bound ligand
# fits inside the derived Vina box (docking.pocket._parse_vertex_extent).
dock_rmsd_threshold: 2.5  # self-dock "success" cutoff (PLAN.md §21, relaxed from the
# literature-standard 2.0 A, 2026-07-20). Live-verified real self-dock on the cealign-fixed
# pipeline (1A7E, OFO ligand) landed at 2.04 A -- a near-perfect redock, hard-failed by
# 0.04 A under the old threshold. `vina_docking._DEFAULT_RMSD_THRESHOLD_ANGSTROM`'s own
# comment has the full reasoning (the RMSD itself is index-order, not symmetry-matched, so
# some slack above the textbook 2.0 A is warranted).

# Complex (receptor+ligand) MD slow lane (PLAN.md §43) -- OFF by default, unlike
# run_md/run_dock: needs openff-toolkit and openff-nagl (ex03's recipe, NAGL charges)
# in validation_conda_prefix, which `make env-validation` builds. Runs only for
# candidates whose docking succeeded; the stage skips the rest gracefully
# (FailureMode.COMPLETENESS), so `run_complex_md=true` is safe before every dock has
# finished.
run_complex_md: false
complex_md_threads: 2  # OpenMM CPU threads per complex; Ray reserves the same number.
# run_complex_md_validation's own defaults: 2500 steps at 4 fs (10 ps), minimised to
# convergence (0 = no iteration cap).
complex_md_n_steps: 2500
complex_md_max_minimization_iterations: 0
