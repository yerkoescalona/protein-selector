[project]
name = "protein-selector"
version = "0.1.0"
description = "Instructor tool: find and a-priori validate candidate proteins for structural bioinformatics exercises"
authors = [{ name = "Yerko Escalona" }]
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "biopython>=1.84",
    "rcsb-api>=1.7.3",
    "tqdm>=4.66",
    # Real, live-discovered undeclared dependency (2026-08-02): `scripts/validate_one.py`
    # -- a documented, first-class CLI (README: `uv run --extra validate python
    # scripts/validate_one.py 1UBQ`) -- imports `yaml` to read workflow/config.yaml, but
    # nothing declared it. That exact documented command failed with
    # `ModuleNotFoundError: No module named 'yaml'` on a clean `uv sync --extra validate`;
    # it only ever worked when `--group workflow` happened to also be synced, since
    # snakemake pulls pyyaml in transitively. Same class of bug as the meeko/gemmi
    # undeclared-transitive-dep gap documented in .claude/CLAUDE.md. Belongs in the BASE
    # deps, not the workflow group, because the documented invocation above doesn't
    # include that group.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Parameterizability ligand parameterizability + pocket detection (heavier deps kept
# optional so hard-filters/simulability candidate search works with just the base deps).
# scipy, numpy, and gemmi are meeko's real transitive dependencies -- meeko
# does not declare them itself (a live-discovered packaging gap, confirmed
# by import errors, not guessed), so they're pinned explicitly here.
# openmm is for future OpenFF-side (MD, not docking) parameterization --
# not yet used by any module; kept alongside meeko since both serve the
# same "full force-field parameterization" PLAN.md §10 goal.
# NOTE: openff-toolkit is intentionally excluded here — its only PyPI release
# is yanked (it's conda-forge-first). Install it separately via conda when
# that OpenFF-side work starts; do not add it back as a pip dependency.
# structure_alignment.py (PLAN.md §18, switched to PyMOL's cealign 2026-07-20): the
# docking receptor is the MD run's own relaxed structure, not a freshly-fetched one — the
# crystal ligand's coordinates must be superposed into that frame first. mdanalysis was
# tried first (a hand-matched (chain, resid, icode) CA correspondence + Kabsch fit) and
# dropped after two separate live-discovered atom-matching bugs; cealign's own structural
# correspondence removes that whole bug class.
# **`pymol-open-source` is now a REAL pip dependency (2026-08-02), reversing the previous
# "system binary only, not installable via pip" note here and in structure_alignment.py.**
# PyPI now ships manylinux wheels for cp39–cp313 (verified), so PyMOL no longer has to be
# installed by hand at the OS level. Live-confirmed: `cealign` ran for real from the pip
# wheel on Google Colab, which had no system PyMOL at all (0.28 Å over 80 residues on
# 2PK4), and `import pymol` works from this repo's own venv interpreter after `uv sync
# --extra validate`.
# Note on the local test suite: adding this did NOT change the pass/skip counts on the
# original dev machine, because that machine already had a system PyMOL
# (/usr/bin/pymol + /usr/lib/python3/dist-packages/pymol), so
# test_structure_alignment.py's `shutil.which("pymol")` guard was already satisfied there.
# The point of declaring the dependency is that the repo no longer DEPENDS on that
# happening to be true — a fresh machine or CI runner now gets a working cealign from
# `uv sync` alone.
# Caveat: every published release is an alpha (3.2.0a0 is current) — that is upstream's
# own versioning, not a pre-release pin chosen here.
validate = [
    "rdkit>=2024.3",
    "meeko",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "openmm>=8.5.2",
    "gemmi>=0.7.5",
    "openmmforcefields>=0.15.1",
    "pymol-open-source>=3.2.0a0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # PLAN.md §27d W5.3: a coverage baseline, not a target -- see `make coverage`.
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]
# Not installed by a plain `uv sync` -- only needed to open notebooks/db_explorer.ipynb.
# Install with `uv sync --group notebook`.
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
webapp = [
    "dash>=4.4.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-cytoscape>=1.0.2",
]
# PLAN.md §30/§31: the Ray runner, evaluated as a replacement for the Snakemake layer.
# Its own group -- a plain `uv sync` must not pull ~500 MB of Ray for someone who only
# wants to read an already-populated store (same rule as `workflow`/`webapp`/`notebook`).
# Deliberately NOT `ray[default]`: the dashboard/cluster-launcher extras are not needed
# for a single-node DAG, and `ray.workflow` is deprecated (§30c) so nothing here uses it.
ray = [
    # PLAN.md §36: `ray[default]` (not bare `ray`) because the dashboard's runtime deps --
    # aiohttp, prometheus-client, opencensus, grpcio -- ship in that extra. The dashboard
    # FRONTEND is already bundled in the wheel; without these it simply never starts, with
    # no error that says so. Needed for `make ray-head`.
    "ray[default]>=2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_selector"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "notebooks",  # example/exploratory cells (e.g. commented-out alternative calls,
    # display() with no import) follow different conventions than source -- not linted.
    "app",  # thin Dash view script (PLAN.md §14) -- no business logic, same
    # "not linted" treatment as notebooks/; the logic it calls into
    # (src/protein_selector/webapp/) is linted/typed/tested normally.
    # same "not linted" treatment as app/; the logic they call into
    # (src/protein_selector/pipeline.py, core/report.py) is linted normally.
    "scripts/colab_*.py",  # `# %%`-cell scripts meant to be pasted into / converted to
    # Google Colab notebooks. Same "not linted" treatment as notebooks/ and for the same
    # reason: the cell format puts imports mid-file by design (E402 throughout), and the
    # cells deliberately import conda-only packages (openff, openmmforcefields) that are
    # not installed in this repo's own venv. Non-cell scripts in scripts/ (e.g.
    # benchmark_pipeline.py, validate_one.py) stay linted normally.
]

[tool.ruff.lint]
select = [
    "E4",  # Import related errors
    "E7",  # Indentation errors
    "E9",  # Hanging indentation / runtime errors
    "F",   # Pyflakes
    "I",   # isort
    "D",   # Docstring checks
    "UP",  # pyupgrade
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Individual test_* methods don't need Google-style docstrings; the class
# docstring documents intent for the group.
"tests/**" = ["D101", "D102", "D103"]

[tool.ty.environment]
# `scripts` is here deliberately: it holds documented, first-class entry points
# (validate_one.py, build_report.py, run_ray_pipeline.py, ...) that README/INSTALL tell
# people to run, so they should not be the one part of the tree nothing typechecks.
root = ["src", "tests", "scripts"]

[tool.ty.src]
# `display()` is an IPython/Jupyter builtin auto-imported at kernel startup,
# not resolvable statically -- same reason notebooks/ is excluded from ruff.
# `app/` isn't under `root` (src, tests) above, so it's already out of scope
# for ty -- listed here too for documentation, same as notebooks/.
exclude = ["notebooks", "app", "scripts/colab_*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
