[project]
name = "protein-selector"
version = "0.1.0"
description = "Instructor tool: find and a-priori validate candidate proteins for structural bioinformatics exercises"
authors = [{ name = "Yerko Escalona" }]
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "biopython>=1.84",
    "rcsb-api>=1.7.3",
]

[project.optional-dependencies]
# Parameterizability ligand parameterizability + pocket detection (heavier deps kept
# optional so hard-filters/simulability candidate search works with just the base deps).
# scipy, numpy, and gemmi are meeko's real transitive dependencies -- meeko
# does not declare them itself (a live-discovered packaging gap, confirmed
# by import errors, not guessed), so they're pinned explicitly here.
# openmm is for future OpenFF-side (MD, not docking) parameterization --
# not yet used by any module; kept alongside meeko since both serve the
# same "full force-field parameterization" PLAN.md §10 goal.
# NOTE: openff-toolkit is intentionally excluded here — its only PyPI release
# is yanked (it's conda-forge-first). Install it separately via conda when
# that OpenFF-side work starts; do not add it back as a pip dependency.
validate = [
    "rdkit>=2024.3",
    "meeko",
    "scipy>=1.17.1",
    "numpy>=2.4.6",
    "openmm>=8.5.2",
    "gemmi>=0.7.5",
    "openmmforcefields>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protein_selector"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E4",  # Import related errors
    "E7",  # Indentation errors
    "E9",  # Hanging indentation / runtime errors
    "F",   # Pyflakes
    "I",   # isort
    "D",   # Docstring checks
    "UP",  # pyupgrade
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Individual test_* methods don't need Google-style docstrings; the class
# docstring documents intent for the group.
"tests/**" = ["D101", "D102", "D103"]

[tool.ty.environment]
root = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
