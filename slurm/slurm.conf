# slurm.conf -- single-node cluster on this workstation (PLAN.md §39).
#
# Generated for THIS machine, not copied from a template:
#   hostname   debian
#   topology   1 socket x 8 cores x 2 threads = 16 CPUs   (from lscpu)
#   memory     31217 MB total                              (from free -m)
# Re-derive with `slurmd -C` if the hardware changes; a NodeName line that claims more
# than the machine has puts the node straight into DRAIN.
#
# Install:  sudo install -m 644 slurm/slurm.conf /etc/slurm/slurm.conf

ClusterName=protein-selector
SlurmctldHost=debian
SlurmUser=slurm

# --- scheduling -------------------------------------------------------------
# cons_tres so a job can ask for CPUs and memory independently -- which is what
# `#SBATCH --cpus-per-task` in slurm/run_pipeline.sbatch relies on. Without it SLURM
# allocates whole nodes and --cpus-per-task is silently meaningless on a 1-node cluster.
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# proctrack/linuxproc + task/none, deliberately: cgroup tracking is stricter and is the
# right choice on a real cluster, but on a single workstation it needs a matching
# cgroup.conf and cgroup-v2 delegation, and getting that wrong makes every job fail to
# launch with an error that points nowhere useful. Start simple; switch to
# proctrack/cgroup once the basic cluster is known good.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
ReturnToService=2

# --- paths ------------------------------------------------------------------
SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# --- accounting -------------------------------------------------------------
# `none` keeps this setup to two daemons. Consequence, stated rather than discovered:
# `sacct` will NOT work -- job history needs slurmdbd plus a database. `squeue` (running)
# and `scontrol show job <id>` (recent) both work. See slurm/SETUP.md step 6.
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/linux

# --- timeouts ---------------------------------------------------------------
SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# --- the node and its partition ---------------------------------------------
# RealMemory is set BELOW the physical 31217 MB on purpose: SLURM drains a node that
# reports less memory than the config claims, and the OS never leaves you all of it.
NodeName=debian CPUs=16 Sockets=1 CoresPerSocket=8 ThreadsPerCore=2 \
    RealMemory=30000 State=UNKNOWN

PartitionName=local Nodes=ALL Default=YES MaxTime=INFINITE State=UP
